name: temporary repair
on:
  push:
    branches: [verify/media-build-audit-2026-08-26]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch joint data and self-remove
        env:
          BRANCH: verify/media-build-audit-2026-08-26
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/PremiumWhiteHumanExerciseAnimation.tsx')
          s=p.read_text()
          old='([q.el,q.er,q.kl,q.kr].map((a,i)=><Joint key={i} a={a}/>))'
          new='([q.el,q.er,q.kl,q.kr] as Pt[]).map((a,i)=>{const joint:{key:number;a:Pt}={key:i,a};return <Joint key={joint.key} a={joint.a}/>})'
          if old not in s:
              raise SystemExit('target joint expression not found')
          p.write_text(s.replace(old,new,1))
          w=Path('.github/workflows/_repair_white_human.yml')
          w.unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/PremiumWhiteHumanExerciseAnimation.tsx .github/workflows/_repair_white_human.yml
          git commit -m 'fix: add explicit joint data key'
          git push origin "$BRANCH"
