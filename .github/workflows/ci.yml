name: CI

on:
  push:
    branches:
      - '**'

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: TypeScript typecheck
        run: bunx tsc --noEmit

      - name: Production build
        run: bun run build
